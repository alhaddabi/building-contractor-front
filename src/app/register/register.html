<app-auth-shell>
  <section class="card">
    <p class="sheet-no">Gate 02 · New client</p>
    <p class="eyebrow">New account</p>
    <h2>Open an account</h2>
    <p class="hint">Your name and email stay with the account, so you can come back to the same shortlist.</p>

    @if (errorMessage()) {
      <p class="banner error">{{ errorMessage() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" formControlName="fullName" autocomplete="name" />

      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />

      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />

      <label for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />

      <button class="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving account...' : 'Create account' }}
      </button>
    </form>

    <p class="switch">
      Already registered?
      <a routerLink="/login">Sign in</a>
    </p>
  </section>
</app-auth-shell>
